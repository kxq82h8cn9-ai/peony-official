<!DOCTYPE html>
<html lang="ar" dir="rtl" x-data="peonyApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عدسات بيوني | Peony Lenses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Tajawal', sans-serif;
            background-image: url('image.png'); /* خلفية العصافير */
            background-attachment: fixed; background-size: cover; background-position: center;
        }
        .lens-card { 
            background-image: linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.85)), url('frame.png'); /* إطار الورود */
            background-size: cover; border: 1px solid #a67c00; border-radius: 40px; backdrop-filter: blur(8px);
        }
        .heart-particle { position: fixed; pointer-events: none; animation: fly 1s ease-out forwards; z-index: 100; font-size: 24px; }
        @keyframes fly { 0% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(0) translateY(-100px); } }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div x-show="showToast" x-transition class="fixed top-10 left-1/2 -translate-x-1/2 z-50 bg-black/80 text-white px-8 py-4 rounded-full border border-[#a67c00] text-sm font-bold shadow-2xl">
        <span x-text="toastMessage"></span>
    </div>

    <header class="py-20 text-center">
        <h1 class="text-4xl font-bold mb-2">نظرة تأسر العالم</h1>
        <h2 class="text-[#a67c00] text-2xl font-bold tracking-widest px-4">برقة الورد وبريق الذهب</h2>
    </header>

    <main class="container mx-auto px-6 pb-24 grid grid-cols-1 md:grid-cols-2 gap-12">
        <template x-for="product in products">
            <div class="lens-card p-8 shadow-2xl relative transition-transform hover:scale-[1.02]">
                <div class="h-80 rounded-[35px] overflow-hidden mb-6 border-4 border-white relative shadow-lg">
                    <img :src="product.img" class="w-full h-full object-cover">
                    <button @click="triggerHearts($event); toggleWish(product)" class="absolute top-4 left-4 bg-white/90 p-4 rounded-full shadow-md">
                        <svg class="w-6 h-6" :class="product.liked ? 'text-red-500' : 'text-gray-300'" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                </div>
                <h3 x-text="product.name" class="text-2xl font-bold text-center mb-6"></h3>
                <a :href="'https://wa.me/9647706008339?text=أريد طلب عدسة ' + product.name" class="block w-full py-5 bg-[#a67c00] text-white text-center rounded-2xl font-bold shadow-lg">اطلبي الآن عبر واتساب</a>
            </div>
        </template>
    </main>

    <script>
        function peonyApp() {
            return {
                showToast: false, toastMessage: '',
                products: [
                    { name: 'أزرق الشفق', img: 'blue.png', liked: false },
                    { name: 'روز كوارتز', img: 'rose.png', liked: false }
                ],
                toggleWish(p) {
                    p.liked = !p.liked;
                    if(p.liked) {
                        this.toastMessage = "اختيار ملكي يليق بجمالكِ 🌸";
                        this.showToast = true; setTimeout(() => this.showToast = false, 3000);
                    }
                },
                triggerHearts(e) {
                    for(let i=0; i<8; i++) {
                        const h = document.createElement('div'); h.innerHTML = '❤️'; h.className = 'heart-particle';
                        h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
                        document.body.appendChild(h); setTimeout(() => h.remove(), 1000);
                    }
                }
            }
        }
    </script>
</body>
</html>
